#
# uv project for the dashboard generator and its tools -- not a published package.
# `uv run <script>` runs any script on the pinned Python (.python-version) with the
# locked dev tools (uv.lock); see README's "Development" section.

[project]
name = "nvidia-dcgm-dashboard"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

# Ruff linter + formatter. Enforced by .githooks/pre-commit. target-version is
# inferred from requires-python above.
#
#   uv run ruff check --fix .   # lint, applying safe autofixes
#   uv run ruff format .        # format
[tool.ruff]
# The exact version is pinned by uv.lock; this floor makes an older ruff (e.g. an
# editor's bundled one) fail loudly instead of disagreeing with the committed
# formatting.
required-version = ">=0.16"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PERF", # perflint
    "RET",  # flake8-return
    "ISC",  # flake8-implicit-str-concat
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez
    "EXE",  # flake8-executable
    "PGH",  # pygrep-hooks
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "FURB", # refurb
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["dcgm_dashboard"]

# pytest + coverage. Every source file (the builder, its row modules, build_dashboard.py,
# and tools/) must stay at 100% line *and* branch coverage; `uv run pytest` fails
# otherwise. Enforced by .githooks/pre-commit.
#
#   uv run pytest               # full suite + coverage report
#   uv run pytest --no-cov -x   # quick iteration, no coverage gate
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# "." for build_dashboard / dcgm_dashboard, "tools" so tests can `import lint_dashboard` etc.
pythonpath = [".", "tools"]
addopts = ["--strict-config", "--strict-markers", "-ra", "--cov", "--cov-report=term-missing:skip-covered"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["build_dashboard", "dcgm_dashboard", "tools"]

[tool.coverage.report]
# tools/ is a plain directory of scripts, not a package: without this, a tools/*.py
# that no test imports would be silently left out of the report instead of showing 0%.
include_namespace_packages = true
fail_under = 100
show_missing = true
skip_covered = true
